version: 2
updates:
  # Frontend / build tooling. The "bun" ecosystem updates bun.lock too; "npm"
  # only touched package.json, which broke `bun install --frozen-lockfile`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Landing page (Astro)
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Promo video (Remotion; not shipped, but audited in CI)
  - package-ecosystem: "bun"
    directory: "/video"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Rust / Tauri backend
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions used in CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
