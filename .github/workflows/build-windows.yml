name: Windows build

# Builds the Windows installer as a workflow artifact on PRs that touch the
# app (or by hand); on a published release it also attaches the installer to
# that release as WiLens-setup.exe (a stable name, like WiLens.dmg), with a
# SHA-256 checksum next to it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]

# The build runs contributor code, so it only gets read access. Write access is
# granted to the release job alone, which runs no repository code.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Build installer
        # The Tauri CLI comes from bun.lock, not a floating npm range.
        run: bun run tauri build --bundles nsis
      - name: Collect installer
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe WiLens-setup.exe
          sha256sum WiLens-setup.exe > WiLens-setup.exe.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WiLens-windows
          path: |
            WiLens-setup.exe
            WiLens-setup.exe.sha256

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WiLens-windows
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        # --clobber lets a re-run of this release replace its own asset.
        run: gh release upload "$TAG" WiLens-setup.exe WiLens-setup.exe.sha256 --clobber
