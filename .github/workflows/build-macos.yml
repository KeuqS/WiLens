name: macOS build

# Builds WiLens.dmg on a published release (or by hand) and attaches it to the
# release with a SHA-256 checksum. When the APPLE_* secrets are configured the
# app is signed with a Developer ID and notarized; without them it falls back
# to the ad-hoc signature from tauri.conf.json, as local builds do.
#
# Secrets (Settings > Secrets and variables > Actions):
#   APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_PASSWORD               app-specific password for that Apple ID
#   APPLE_TEAM_ID                10-character team ID
on:
  workflow_dispatch:
  release:
    types: [published]

# The build only needs to read the repository. Write access is granted to the
# release job alone, which runs no repository code.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Configure signing and notarization
        # Tauri treats a set-but-empty variable as configured, so export only
        # the secrets that actually exist.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          configured=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delimiter="EOF_$(uuidgen)"
              { echo "$name<<$delimiter"; printenv "$name"; echo "$delimiter"; } >> "$GITHUB_ENV"
              configured=$((configured + 1))
            fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "::warning::APPLE_* secrets are not set; building an ad-hoc signed, un-notarized DMG."
          fi
      - name: Build DMG
        run: bun run tauri build --bundles dmg
      - name: Collect DMG
        run: |
          cp src-tauri/target/release/bundle/dmg/WiLens_*_aarch64.dmg WiLens.dmg
          shasum -a 256 WiLens.dmg > WiLens.dmg.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WiLens-macos
          path: |
            WiLens.dmg
            WiLens.dmg.sha256

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WiLens-macos
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        # --clobber lets a re-run of this release replace its own asset.
        run: gh release upload "$TAG" WiLens.dmg WiLens.dmg.sha256 --clobber
